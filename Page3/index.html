<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader</title>
    <style>
        /* Remove margens e garante fundo transparente */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loader-wrapper {
            display: inline-block;
            text-align: center;
            width: 100%;
            max-width: 360px;
            padding: 10px;
            box-sizing: border-box;
        }

        .loader-wrapper h2 {
            color: #ffffff; /* Texto em branco para destacar no fundo escuro */
            font-size: 1.15rem;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .loader-wrapper p {
            color: #cbd5e1; /* Cinza claro para subtítulo */
            font-size: 0.85rem;
            margin: 0 0 16px 0;
        }

        /* Barra de Progresso Estilizada */
        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.15); /* Fundo sutil da barra */
            border-radius: 99px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981, #059669);
            height: 100%;
            width: 90%; /* 90% solicitado */
            border-radius: 99px;
            position: relative;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Efeito de brilho animado na barra */
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 1.5s infinite;
        }

        .percentage-text {
            font-weight: 700;
            color: #34d399; /* Verde claro vibrante */
            font-size: 1rem;
            margin: 0;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="loader-wrapper">
        <h2>¡Tu compra está casi completa!</h2>
        <p>Por favor, espera un momento para finalizar tu registro.</p>
        
        <div class="progress-bar-wrapper">
            <div class="progress-bar-fill"></div>
        </div>
        
        <div class="percentage-text">85%</div>
    </div>

</body>
</html>
